<!DOCTYPE html>
<html lang="en">
	<head>
		<title>TriDev</title>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width" />
		
		<!-- Preload fonts to prevent layout shifts -->
		<link rel="preload" href="%sveltekit.assets%/fonts/Gotham/GothamBold_Regular.otf" as="font" type="font/otf" crossorigin>
		<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" as="style">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap">
		
		<!-- Prevent theme flash -->
		<script>
			(function() {
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = prefersDark ? 'dark' : 'light';
				document.documentElement.style.backgroundColor = theme === 'dark' ? '#0F0F0F' : '#fff';
				document.documentElement.style.color = theme === 'dark' ? '#EFEFEF' : '#394e6a';
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>

		<!-- todo we will likely to do this with svelte as the site grow -->
		<meta name="description" content="A software developer meetup in Johnson City, TN. The second Tuesday each month we discuss topics like JavaScript, React, Svelte, Vue, ASP.NET, Python, Web3 Solidity and more."/>

		<meta content="TriDev" name="author"/>
		<meta content="TriDev MeetUp" property="og:site_name"/>
		<meta property="og:title" content="TriDev MeetUp" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://tricities.dev" />
		<meta property="og:image" content="https://tricities.dev/tridev-logo.jpg" />

		<meta name="twitter:title" content="TriDev MeetUp ">
		<meta name="twitter:description" content="A software developer meetup in Johnson City, TN. The second Tuesday each month we discuss topics like JavaScript, React, Svelte, Vue, ASP.NET, Python, Web3 Solidity and more.">
		<meta name="twitter:image" content="https://tricities.dev/tridev-logo.jpg">
		<meta name="twitter:card" content="summary_large_image">
		%sveltekit.head%

	</head>
	<body>
		%sveltekit.body%
	</body>
</html>

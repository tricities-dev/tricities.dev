<!DOCTYPE html>
<html lang="en">
	<head>
		<title>TriDev - Tri-Cities Developer Meetup | Johnson City, TN</title>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="canonical" href="https://tricities.dev" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

		<!-- Preconnect to external resources -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="dns-prefetch" href="https://meetup-scrapper.mackenly.workers.dev" />

		<!-- Preload fonts to prevent layout shifts -->
		<link rel="preload" href="%sveltekit.assets%/fonts/Gotham/GothamBold_Regular.otf" as="font" type="font/otf" crossorigin>
		<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" as="style">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap">

		<!-- Prevent theme flash -->
		<script>
			(function() {
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = prefersDark ? 'dark' : 'light';
				document.documentElement.style.backgroundColor = theme === 'dark' ? '#0F0F0F' : '#fff';
				document.documentElement.style.color = theme === 'dark' ? '#EFEFEF' : '#394e6a';
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>

		<!-- Primary Meta Tags -->
		<meta name="description" content="Join TriDev - the premier software developer meetup in Johnson City, TN. Every 2nd Tuesday we explore JavaScript, React, Python, .NET, and more. Free to attend, open to all skill levels!"/>
		<meta name="keywords" content="developer meetup, Johnson City, Tri-Cities, Tennessee, software development, JavaScript, React, Python, .NET, coding, programming, tech community" />
		<meta name="author" content="TriDev" />
		<meta name="robots" content="index, follow" />

		<!-- Open Graph / Facebook -->
		<meta property="og:site_name" content="TriDev - Tri-Cities Developer Meetup" />
		<meta property="og:title" content="TriDev - Free Developer Meetup in Johnson City, TN" />
		<meta property="og:description" content="Join 100+ developers every 2nd Tuesday. Learn, network, and grow your skills. All experience levels welcome!" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://tricities.dev" />
		<meta property="og:image" content="https://tricities.dev/tridev-logo.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="TriDev - Free Developer Meetup in Johnson City, TN" />
		<meta name="twitter:description" content="Join 100+ developers every 2nd Tuesday. Learn, network, and grow your skills. All experience levels welcome!" />
		<meta name="twitter:image" content="https://tricities.dev/tridev-logo.jpg" />

		<!-- JSON-LD Structured Data -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Organization",
			"name": "TriDev",
			"alternateName": "Tri-Cities Developer Meetup",
			"url": "https://tricities.dev",
			"logo": "https://tricities.dev/tridev-logo.jpg",
			"description": "A free software developer meetup in Johnson City, TN meeting every 2nd Tuesday of the month.",
			"address": {
				"@type": "PostalAddress",
				"addressLocality": "Johnson City",
				"addressRegion": "TN",
				"addressCountry": "US"
			},
			"sameAs": [
				"https://www.meetup.com/tridev/",
				"https://discord.gg/B3JAaXvkCt"
			],
			"event": {
				"@type": "Event",
				"name": "TriDev Monthly Meetup",
				"description": "Monthly software developer meetup featuring talks on JavaScript, React, Python, .NET, and more.",
				"eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
				"eventStatus": "https://schema.org/EventScheduled",
				"location": {
					"@type": "Place",
					"name": "Spark Plaza",
					"address": {
						"@type": "PostalAddress",
						"addressLocality": "Johnson City",
						"addressRegion": "TN",
						"addressCountry": "US"
					}
				},
				"organizer": {
					"@type": "Organization",
					"name": "TriDev",
					"url": "https://tricities.dev"
				},
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD",
					"availability": "https://schema.org/InStock",
					"url": "https://www.meetup.com/tridev/"
				},
				"isAccessibleForFree": true
			}
		}
		</script>

		%sveltekit.head%

	</head>
	<body>
		%sveltekit.body%
	</body>
</html>
